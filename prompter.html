<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="orOS Prompter — 100 creative writing prompts across 12 genres. Micro-fiction, haiku, poetry, songs, theater, novels. Privacy-first. No tracking.">
  <meta name="author" content="Christos Koulaxizis">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#c8a96e">

  <meta property="og:type" content="article">
  <meta property="og:url" content="https://koulaxizis.github.io/oros-beta/prompter.html">
  <meta property="og:title" content="orOS Prompter — Creative Writing Prompts">
  <meta property="og:description" content="100 writing prompts · 12 genres · bilingual. Micro-fiction, haiku, poetry, theater, and more.">
  <meta property="og:image" content="https://koulaxizis.github.io/oros-beta/og-image.png">
  <meta property="og:site_name" content="orOS">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="orOS Prompter — Creative Writing Prompts">
  <meta name="twitter:description" content="100 writing prompts · 12 genres · bilingual.">
  <meta name="twitter:image" content="https://koulaxizis.github.io/oros-beta/twitter-card.png">

  <link rel="alternate" hreflang="en" href="https://koulaxizis.github.io/oros-beta/prompter.html">
  <link rel="alternate" hreflang="el" href="https://koulaxizis.github.io/oros-beta/prompter.html?lang=el">
  <link rel="alternate" hreflang="x-default" href="https://koulaxizis.github.io/oros-beta/prompter.html">

  <title>orOS Prompter — Creative Writing</title>
  <script src="config.js"></script>
  <script>
    document.write('<base href="' + (OROS_CONFIG.baseHref || '/') + '">');
    var cLink = document.createElement('link');
    cLink.rel = 'canonical';
    cLink.href = OROS_CONFIG.domain + window.location.pathname;
    document.head.appendChild(cLink);
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="assets/css/icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/prompter.css">

  <script src="assets/js/global-settings.js" defer></script>
  <script src="assets/js/seo.js" defer></script>
  <script src="assets/js/components/header.js" defer></script>
  <script src="assets/js/components/footer.js" defer></script>
  <script src="assets/js/prompter.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body class="noscript">
  <script>document.body.classList.remove('noscript'); document.body.classList.add('js-enabled');</script>

  <noscript>
    <div class="noscript-message">JavaScript is required for orOS Prompter. Please enable JavaScript.</div>
  </noscript>

  <div id="oros-header"></div>

  <!-- Toolbar -->
  <div class="prompter-toolbar">
    <input type="text" id="prompter-search" placeholder="Search prompts..." data-i18n-ph="prompter_search_ph">
    <button class="action-btn" id="btn-random-prompt" title="Random Prompt" data-i18n-title="prompter_random">
      <i class="fa fa-random"></i>
    </button>
    <button class="action-btn" id="btn-mark-complete" title="Mark Complete" data-i18n-title="prompter_mark_complete">
      <i class="fa fa-check"></i>
    </button>
    <button class="action-btn" id="btn-export-writing" title="Export" data-i18n-title="prompter_export">
      <i class="fa fa-download"></i>
    </button>
  </div>

  <!-- Category Navigation -->
  <div class="prompter-categories" id="prompter-categories"></div>

  <!-- Main Layout -->
  <div class="prompter-main">
    <!-- Prompt Grid -->
    <div class="prompter-grid" id="prompter-grid"></div>

    <!-- Prompt Detail -->
    <div class="prompter-detail" id="prompter-detail" style="display:none;"></div>

    <!-- Writing Area -->
    <div class="prompter-writing" id="prompter-writing" style="display:none;">
      <div class="writing-header">
        <h4 data-i18n="prompter_your_text">Your Text</h4>
        <span id="prompter-word-count">0 words</span>
      </div>
      <textarea placeholder="Start writing..." data-i18n-ph="prompter_write_ph"></textarea>
    </div>
  </div>

  <!-- SHARED SETTINGS MODAL -->
  <div class="settings-modal">
    <div class="settings-modal-overlay"></div>
    <div class="settings-modal-content">
      <div class="settings-header">
        <h2 data-i18n="settings">Settings</h2>
        <button class="settings-close" aria-label="Close settings"><i class="fa fa-times"></i></button>
      </div>
      <div class="settings-nav">
        <button class="tab-btn active" data-tab="global-settings" data-i18n="tab_global">Global</button>
        <button class="tab-btn" data-tab="writer-settings" data-i18n="tab_writer">Writer</button>
        <button class="tab-btn" data-tab="converter-settings" data-i18n="tab_converter">Converter</button>
        <button class="tab-btn" data-tab="kanban-settings" data-i18n="tab_kanban">Kanban</button>
        <button class="tab-btn" data-tab="wiki-settings" data-i18n="tab_wiki">Wiki Notes</button>
      </div>
      <div class="settings-body">
        <div class="tab-panel" id="global-settings" style="display:flex;">
          <div class="toggles-container">
            <div class="toggle-row">
              <span class="toggle-label" data-i18n="toggle_zen">Zen Mode</span>
              <label class="switch"><input type="checkbox" id="toggle-zen-mode"><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
              <span class="toggle-label" data-i18n="install_app">Install as App</span>
              <button class="btn-install" id="btn-install" disabled>Install</button>
            </div>
          </div>
        </div>
        <div class="tab-panel" id="writer-settings" style="display:none;"></div>
        <div class="tab-panel" id="converter-settings" style="display:none;"></div>
        <div class="tab-panel" id="kanban-settings" style="display:none;"></div>
        <div class="tab-panel" id="wiki-settings" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div id="oros-footer"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
