  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "orOS Notes",

    "applicationCategory": "ProductivityApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR"
    },
    "license": "https://github.com/koulaxizis/oros-beta/blob/main/LICENSE"
  }

  <title>orOS Notes — Privacy-First Wiki Notes</title>
  <script src="config.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register(
          OROS_CONFIG.baseHref + 'service-worker.js',
          { scope: OROS_CONFIG.baseHref }
        ).catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="assets/fonts/nunito-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-extrabold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/notes.css">

  <script src="assets/js/global-settings.js" defer></script>
  <script src="assets/js/seo.js" defer></script>
  <script src="assets/js/components/header.js" defer></script>
  <script src="assets/js/components/footer.js" defer></script>
  <script src="assets/js/notes.js" defer></script>
</head>
<body class="notes-page noscript">
  <script>document.body.classList.remove('noscript'); document.body.classList.add('js-enabled');</script>

  <noscript>
    <div class="noscript-message">JavaScript is required for orOS Notes to function. Please enable JavaScript.</div>
  </noscript>

  <div id="oros-header"></div>

  <!-- Notes Toolbar -->
  <div class="notes-toolbar" id="notes-toolbar">
    <div class="notes-toolbar-left">
      <button class="notes-toggle-btn" id="btn-toggle-sidebar" title="Toggle sidebar" data-i18n-aria="aria_toggle_sidebar">
        <i class="fa fa-bars"></i>
      </button>
      <button class="notes-action-btn" id="btn-new-note" title="New note" data-i18n-aria="aria_new_note">
        <i class="fa fa-plus"></i> <span data-i18n="notes_new_note">New Note</span>
      </button>
      <button class="notes-action-btn" id="btn-new-folder" title="New folder" data-i18n-aria="aria_new_folder">
        <i class="fa fa-folder-o"></i> <span data-i18n="notes_new_folder">New Folder</span>
      </button>
    </div>

    <div class="notes-toolbar-center">
      <div class="notes-search-box">
        <i class="fa fa-search search-icon"></i>
        <input type="text" class="notes-search-input" id="notes-search" 
               placeholder="Search notes..." data-i18n-placeholder="notes_search_placeholder">
        <button class="notes-search-clear" id="notes-search-clear" style="display:none;">
          <i class="fa fa-times"></i>
        </button>
      </div>
    </div>

    <div class="notes-toolbar-right">
      <div class="view-toggle">
        <button class="view-btn active" id="btn-view-split" title="Split view" data-i18n-title="view_split">
          <i class="fa fa-columns"></i>
        </button>
        <button class="view-btn" id="btn-view-editor" title="Editor only" data-i18n-title="view_editor_only">
          <i class="fa fa-edit"></i>
        </button>
        <button class="view-btn" id="btn-view-preview" title="Preview only" data-i18n-title="view_preview_only">
          <i class="fa fa-file-text"></i>
        </button>
      </div>
      <button class="notes-action-btn" id="btn-import" title="Import notes" data-i18n-aria="aria_import">
        <i class="fa fa-folder-open"></i>
      </button>
      <button class="notes-action-btn" id="btn-export" title="Export all notes" data-i18n-aria="aria_export">
        <i class="fa fa-download"></i>
      </button>
      <input type="file" id="import-file-input" accept=".json" style="display:none;">
    </div>
  </div>

  <!-- Main Container -->
  <div class="notes-container" id="notes-container">
    
    <!-- Sidebar (Folders + Notes List) -->
    <aside class="notes-sidebar" id="notes-sidebar">
      <div class="sidebar-content">
        <div class="sidebar-tree" id="sidebar-tree">
          <!-- Tree rendered dynamically -->
        </div>
      </div>
    </aside>

    <!-- Editor / Preview Area -->
    <main class="notes-main" id="notes-main">
      
      <!-- Empty State -->
      <div class="notes-empty-state" id="notes-empty-state">
        <div class="empty-icon"><i class="fa fa-book"></i></div>
        <h2 data-i18n="notes_empty_title">No notes yet</h2>
        <p data-i18n="notes_empty_desc">Create your first note to get started.</p>
        <button class="btn-create-first-note" id="btn-create-first-note">
          <i class="fa fa-plus"></i> <span data-i18n="notes_create_first_note">Create Note</span>
        </button>
      </div>

      <!-- Editor Panel -->
      <div class="notes-editor-panel" id="notes-editor-panel" style="display:none;">
        <div class="editor-header">
          <input type="text" class="note-title-input" id="note-title-input" placeholder="Note title..." data-i18n-placeholder="notes_title_placeholder">
          <div class="editor-actions">
            <button class="editor-action-btn" id="btn-markdown-toggle" title="Markdown preview toggle" data-i18n-aria="aria_markdown_toggle">
              <i class="fa fa-code"></i>
            </button>
            <button class="editor-action-btn" id="btn-export-note" title="Export this note" data-i18n-aria="aria_export_note">
              <i class="fa fa-download"></i>
            </button>
            <button class="editor-action-btn delete" id="btn-delete-note" title="Delete note" data-i18n-aria="aria_delete_note">
              <i class="fa fa-trash-o"></i>
            </button>
          </div>
        </div>
        
        <div class="editor-tabs" id="editor-tabs">
          <button class="tab-btn active" id="tab-write" data-tab="write" data-i18n="tab_write">Write</button>
          <button class="tab-btn" id="tab-preview" data-tab="preview" data-i18n="tab_preview">Preview</button>
        </div>

        <div class="editor-body">
          <textarea class="note-editor" id="note-editor" placeholder="Start writing... Use [[wikilinks]] to connect notes." data-i18n-placeholder="notes_editor_placeholder"></textarea>
          <div class="note-preview" id="note-preview"></div>
        </div>

        <div class="editor-footer">
          <div class="note-meta">
            <span class="meta-item">
              <i class="fa fa-clock-o"></i>
              <span id="note-modified"></span>
            </span>
            <span class="meta-item">
              <i class="fa fa-word-count"></i>
              <span id="note-words">0 words</span>
            </span>
            <span class="meta-item">
              <i class="fa fa-link"></i>
              <span id="note-links">0 links</span>
            </span>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="context-menu">
    <div class="context-item" data-action="rename"><i class="fa fa-pencil"></i> <span data-i18n="ctx_rename">Rename</span></div>
    <div class="context-item" data-action="delete"><i class="fa fa-trash-o"></i> <span data-i18n="ctx_delete">Delete</span></div>
    <div class="context-divider"></div>
    <div class="context-item" data-action="cut"><i class="fa fa-cut"></i> <span data-i18n="ctx_cut">Cut</span></div>
    <div class="context-item" data-action="paste"><i class="fa fa-paste"></i> <span data-i18n="ctx_paste">Paste</span></div>
  </div>

  <!-- Rename Modal -->
  <div class="modal rename-modal" id="rename-modal">
    <div class="modal-overlay" id="rename-modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="modal_rename">Rename</h3>
        <button class="modal-close" id="rename-modal-close"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <label class="modal-label" data-i18n="modal_new_name">New name:</label>
        <input type="text" class="modal-input" id="rename-input">
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="rename-cancel" data-i18n="btn_cancel">Cancel</button>
        <button class="btn-confirm" id="rename-confirm" data-i18n="btn_confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Link Picker Modal (when clicking broken link) -->
  <div class="modal link-picker-modal" id="link-picker-modal" style="display:none;">
    <div class="modal-overlay" id="link-picker-modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="modal_create_or_select">Create or Select Note</h3>
        <button class="modal-close" id="link-picker-modal-close"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="text" class="modal-input link-picker-target" id="link-picker-target" placeholder="Type note name...">
        <div class="note-list-results" id="note-list-results"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="link-picker-cancel" data-i18n="btn_cancel">Cancel</button>
        <button class="btn-confirm" id="link-picker-create" data-i18n="modal_create_new">Create New</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="zentool-toast" id="zen-toast" style="display:none;"></div>

  <div id="oros-footer"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>

</body>
</html>
