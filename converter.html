<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="orOS Case Converter — Privacy-first text transformation tool. Works offline. No tracking.">
  <title>orOS Case Converter</title>
  <script src="config.js"></script>
  <script>
    document.write('<base href="' + (OROS_CONFIG.baseHref || '/') + '">');
    var cLink = document.createElement('link');
    cLink.rel = 'canonical';
    cLink.href = OROS_CONFIG.domain + window.location.pathname;
    document.head.appendChild(cLink);
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="assets/fonts/nunito-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-extrabold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/converter.css">

  <script src="assets/js/components/header.js" defer></script>
  <script src="assets/js/components/footer.js" defer></script>
  <script src="assets/js/converter.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>

  <div id="oros-header"></div>

  <div id="converter-wrapper">

    <div class="converter-toolbar" id="converter-toolbar">
      <div class="toolbar-section toolbar-left">
        <button class="action-btn" id="btn-copy" data-i18n-tooltip="tooltip_copy" title="Copy to clipboard (Ctrl+C)">
          <i class="fa fa-copy"></i>
        </button>
        <button class="action-btn" id="btn-save" data-i18n-tooltip="tooltip_save_file" title="Save file (Ctrl+S)">
          <i class="fa fa-save"></i>
        </button>
        <button class="action-btn" id="btn-open" data-i18n-tooltip="tooltip_open" title="Open file">
          <i class="fa fa-folder-open"></i>
        </button>
        <input type="file" id="file-input" accept=".txt,.md,.markdown" style="display:none;">
        <button class="action-btn" id="btn-clear" data-i18n-tooltip="tooltip_clear" title="Clear all (Ctrl+Delete)">
          <i class="fa fa-trash-o"></i>
        </button>
        <button class="action-btn" id="btn-undo" data-i18n-tooltip="tooltip_undo" title="Undo (Ctrl+Z)">
          <i class="fa fa-undo"></i>
        </button>
        <button class="action-btn" id="btn-redo" data-i18n-tooltip="tooltip_redo" title="Redo (Ctrl+Y)">
          <i class="fa fa-repeat"></i>
        </button>
        <span class="tb-separator"></span>
        <button class="action-btn" id="btn-reset" data-i18n-tooltip="tooltip_reset" title="Restore original">
          <i class="fa fa-refresh"></i>
        </button>
      </div>

      <div class="toolbar-section toolbar-center">
        <button class="mode-btn" data-mode="uppercase" data-i18n="mode_uppercase" title="UPPERCASE">UPPERCASE</button>
        <button class="mode-btn" data-mode="lowercase" data-i18n="mode_lowercase" title="lowercase">lowercase</button>
        <button class="mode-btn" data-mode="title" data-i18n="mode_title" title="Title Case">Title Case</button>
        <button class="mode-btn" data-mode="sentence" data-i18n="mode_sentence" title="Sentence case">Sentence case</button>
        <button class="mode-btn" data-mode="toggle" data-i18n="mode_toggle" title="tOGGLE cASE">tOGGLE</button>
        <span class="tb-separator"></span>
        <button class="mode-btn" data-mode="camel" data-i18n="mode_camel" title="camelCase">camelCase</button>
        <button class="mode-btn" data-mode="pascal" data-i18n="mode_pascal" title="PascalCase">PascalCase</button>
        <button class="mode-btn" data-mode="snake" data-i18n="mode_snake" title="snake_case">snake_case</button>
        <button class="mode-btn" data-mode="kebab" data-i18n="mode_kebab" title="kebab-case">kebab-case</button>
        <button class="mode-btn" data-mode="constant" data-i18n="mode_constant" title="CONSTANT_CASE">CONSTANT</button>
      </div>

      <div class="toolbar-section toolbar-right">
        <div class="options-dropdown" id="options-dropdown-container">
          <button class="action-btn dropdown-toggle" id="btn-options" data-i18n-tooltip="tooltip_options" title="Conversion options">
            <i class="fa fa-sliders"></i>
            <i class="fa fa-caret-down dropdown-arrow-icon"></i>
          </button>
          <div class="dropdown-content" id="options-dropdown">
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-sentence-preserve">
                <span data-i18n="opt_sentence_preserve">Preserve sentence starts</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-word-preserve">
                <span data-i18n="opt_word_preserve">Preserve word starts</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-acronyms">
                <span data-i18n="opt_acronyms">Preserve acronyms</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-roman">
                <span data-i18n="opt_roman">Preserve Roman numerals</span>
              </label>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-trim">
                <span data-i18n="opt_trim">Trim lines</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-collapse">
                <span data-i18n="opt_collapse">Collapse spaces</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-removelinebreaks">
                <span data-i18n="opt_removelinebreaks">Remove line breaks</span>
              </label>
            </div>
            <div class="dropdown-option">
              <label class="option-label">
                <input type="checkbox" id="opt-removechars">
                <span data-i18n="opt_removechars">Remove special chars</span>
              </label>
            </div>
          </div>
        </div>
        <button class="action-btn" id="btn-stats" data-i18n-tooltip="tooltip_stats" title="Statistics">
          <i class="fa fa-bar-chart"></i>
        </button>
      </div>
    </div>

    <div class="converter-content">
      <textarea id="input-area" data-i18n-placeholder="input_placeholder" spellcheck="false"></textarea>
      <div class="arrow-indicator"><i class="fa fa-arrow-down"></i></div>
      <div class="output-container">
        <textarea id="output-area" readonly data-i18n-placeholder="output_placeholder" spellcheck="false"></textarea>
        <div class="stats-panel" id="stats-panel" style="display:none;">
          <div class="stat-item">
            <span class="stat-label" data-i18n="stats_chars">Characters</span>
            <span class="stat-value" id="stat-chars">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="stats_words">Words</span>
            <span class="stat-value" id="stat-words">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="stats_lines">Lines</span>
            <span class="stat-value" id="stat-lines">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="stats_sentences">Sentences</span>
            <span class="stat-value" id="stat-sentences">0</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="oros-footer"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(function(err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>

</body>
</html>
