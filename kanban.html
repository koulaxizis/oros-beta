<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban — orOS</title>
  <link rel="stylesheet" href="/forkawesome/fork-awesome.min.css">
  <link rel="stylesheet" href="/assets/css/kanban.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6d4aff">
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Header -->
    <header class="kanban-header">
      <div class="header-left">
        <button id="board-selector-btn" class="board-selector-btn" title="Select Board">
          <i class="fa fa-folder-open"></i>
          <span id="current-board-name">Loading...</span>
          <i class="fa fa-caret-down"></i>
        </button>
        <div id="board-list" class="board-selector-dropdown">
          <div class="board-list-items"></div>
        </div>
        
        <input type="text" id="board-rename-input" class="board-rename-input" style="display:none;">
      </div>
      
      <div class="header-center">
        <input type="text" class="kanban-search-input" placeholder="Search cards...">
        <button class="kanban-search-clear"><i class="fa fa-times"></i></button>
      </div>
      
      <div class="header-right">
        <button id="btn-new-board" class="header-btn" title="New Board">
          <i class="fa fa-plus"></i>
        </button>
        
        <button id="btn-import" class="header-btn" title="Import Board">
          <i class="fa fa-upload"></i>
        </button>
        <input type="file" id="import-file" accept=".json,.csv" style="display:none;">
        
        <button id="btn-export" class="header-btn" title="Export Board">
          <i class="fa fa-download"></i>
        </button>
        <div id="export-options" class="kanban-export-menu">
          <button id="export-full" class="export-option">Full Backup (JSON)</button>
          <button id="export-csv" class="export-option">Export as CSV</button>
        </div>
        
        <button id="btn-stats" class="header-btn" title="Statistics">
          <i class="fa fa-bar-chart"></i>
        </button>
        
        <button id="btn-archive-toggle" class="header-btn" title="Show Archived">
          <i class="fa fa-archive"></i>
        </button>
        
        <button id="btn-labels" class="header-btn" title="Manage Labels">
          <i class="fa fa-tags"></i>
        </button>
        
        <button id="btn-help" class="header-btn" title="Keyboard Shortcuts">
          <i class="fa fa-question-circle"></i>
        </button>
      </div>
    </header>

    <!-- Filter Dropdown -->
    <div id="filter-btn" class="kanban-filter-dropdown" style="display:none;">
      <button class="filter-toggle"><i class="fa fa-filter"></i> Filter</button>
      <div id="filter-dropdown-content" class="filter-content"></div>
    </div>

    <!-- Main Board Area -->
    <main id="kanban-board-area" class="kanban-board-area">
      <div id="kanban-empty-state" class="empty-state">
        <div class="empty-icon"><i class="fa fa-tasks"></i></div>
        <h2>No boards yet</h2>
        <p>Create your first board to get started.</p>
        <button id="kanban-create-first-board" class="btn-primary">Create Board</button>
      </div>
      
      <div class="kanban-toolbar">
        <button id="btn-add-column" class="toolbar-btn">
          <i class="fa fa-plus"></i> Add Column
        </button>
        <div class="toolbar-spacer"></div>
        <select id="filter-select" class="filter-select">
          <option value="">All Labels</option>
        </select>
      </div>
      
      <div id="kanban-columns" class="kanban-columns"></div>
    </main>

    <!-- Card Modal -->
    <div id="card-modal-overlay" class="modal-overlay"></div>
    <div id="card-modal" class="modal card-modal">
      <div class="modal-header">
        <h3>Edit Card</h3>
        <button id="card-modal-close" class="modal-close"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="text" id="card-edit-title" class="card-edit-input" placeholder="Card title...">
        
        <textarea id="card-edit-description" class="card-edit-textarea" placeholder="Description... Use **bold**, *italic*, ~~strikethrough~~, ```code``, ## Heading, - List"></textarea>
        <div id="md-preview" class="markdown-preview" style="display:none;"></div>
        <button id="md-toggle-btn" class="md-toggle-btn">Markdown Preview</button>
        
        <div class="card-edit-section">
          <label>Due Date:</label>
          <input type="date" id="card-edit-due-date" class="card-edit-date">
          <button id="btn-clear-due" class="btn-small">Clear</button>
        </div>
        
        <div class="card-edit-section">
          <label>Priority:</label>
          <div class="priority-buttons">
            <button class="priority-btn" data-priority="0">None</button>
            <button class="priority-btn" data-priority="1">Low</button>
            <button class="priority-btn" data-priority="2">Medium</button>
            <button class="priority-btn" data-priority="3">High</button>
          </div>
        </div>
        
        <div class="card-edit-section">
          <label>Color:</label>
          <div class="color-picker">
            <div class="color-swatch" data-color="" title="No color"></div>
            <div class="color-swatch" data-color="#4caf50" title="Green"></div>
            <div class="color-swatch" data-color="#f44336" title="Red"></div>
            <div class="color-swatch" data-color="#2196f3" title="Blue"></div>
            <div class="color-swatch" data-color="#ff9800" title="Orange"></div>
            <div class="color-swatch" data-color="#9c27b0" title="Purple"></div>
            <div class="color-swatch" data-color="#e91e63" title="Pink"></div>
            <div class="color-swatch" data-color="#03a9f4" title="Cyan"></div>
          </div>
        </div>
        
        <div class="card-edit-section">
          <label>Labels:</label>
          <div id="card-edit-labels" class="card-labels-editor"></div>
          <button id="btn-show-labels" class="btn-small">Manage Labels</button>
        </div>
        
        <div id="label-picker" class="label-picker" style="display:none;">
          <div id="label-picker-list"></div>
        </div>
        
        <div class="card-edit-section">
          <label>Subtasks:</label>
          <div id="subtask-list" class="subtask-list"></div>
          <div class="subtask-add">
            <input type="text" id="subtask-input" class="subtask-input" placeholder="New subtask...">
            <button id="btn-add-subtask" class="btn-small">Add</button>
          </div>
        </div>
        
        <div class="card-edit-section">
          <label>Assignments:</label>
          <div id="card-edit-assignments" class="assignments-list"></div>
          <button id="btn-add-assignment" class="btn-small">Add Assignment</button>
        </div>
        
        <div class="card-meta-info">
          <span id="card-meta-created"></span>
          <span id="card-meta-modified"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-duplicate-card" class="btn-secondary">Duplicate</button>
        <button id="btn-archive-card" class="btn-secondary">Archive</button>
        <button id="card-delete-btn" class="btn-danger">Delete</button>
        <div class="spacer"></div>
        <button id="btn-save-card" class="btn-primary">Save</button>
      </div>
    </div>

    <!-- Label Management Modal -->
    <div id="label-modal-overlay" class="modal-overlay"></div>
    <div id="label-modal" class="modal label-modal">
      <div class="modal-header">
        <h3>Manage Labels</h3>
        <button id="label-modal-close" class="modal-close"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div id="label-modal-body" class="label-manage-list"></div>
        <button id="btn-add-label-modal" class="btn-primary">Add New Label</button>
      </div>
    </div>

    <!-- Statistics Modal -->
    <div id="stats-modal-overlay" class="modal-overlay"></div>
    <div id="stats-modal" class="modal stats-modal">
      <div class="modal-header">
        <h3>Board Statistics</h3>
        <button id="btn-close-stats" class="modal-close"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div id="stats-modal-body" class="stats-content"></div>
      </div>
    </div>

    <!-- Column Title Edit Input -->
    <input type="text" id="column-title-edit" class="column-title-edit" style="display:none;">
  </div>

  <script src="/assets/js/kanban.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(reg) {
          console.log('SW registration failed:', reg);
        });
      });
    }
  </script>
</body>
</html>
